name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 * *" # monthly rebuild, so the page keeps pointing at the next events

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (astronomy, calendars, events, feeds, anonymity)
        run: go test ./... -v
      - name: Build the feeds
        run: go run ./cmd/koyomi build -out site
      - name: Summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          { echo '### Koyomi'; echo '```'; go run ./cmd/koyomi compare 2027; echo; go test ./... -v | grep -E "compared|checked|worst"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        with:
          path: site

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
